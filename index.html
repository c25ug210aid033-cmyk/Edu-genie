<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft - Generative AI Comic Strip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ComicCraft 🎨</h1>
        <p>Naan Mudhalvan Generative AI Project</p>
    </header>

    <main class="container">
        <section class="input-section">
            <h2>Create Your Comic Story</h2>
            <textarea id="promptInput" placeholder="Enter your story prompt here... (e.g., A superhero saving a cute puppy in a rainy city)"></textarea>
            <button id="generateBtn">Generate Comic</button>
        </section>

        <section class="comic-display">
            <h2>Your Comic Panel</h2>
            <div id="comicOutput" class="comic-box">
                <p id="placeholderText">Your generated comic panel will appear here!</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Presented by Sri Moogambigai Arts and Science College for Women</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
